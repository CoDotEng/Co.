<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apply for a Build | CODOT</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <style>
        /* --- CORE CSS --- */
        :root {
            --bg-color: #050505;
            --surface-color: #121212;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --accent: #00e5ff;
            --accent-glow: rgba(0, 229, 255, 0.4);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            overflow-x: hidden;
        }

        h1, h2, h3, .logo { font-family: 'Space Grotesk', sans-serif; }
        a { text-decoration: none; color: var(--text-main); transition: color 0.3s ease; }

        /* --- NAVIGATION --- */
        nav {
            display: flex; justify-content: space-between; align-items: center;
            padding: 2rem 5%; position: fixed; width: 100%; top: 0;
            background: rgba(5, 5, 5, 0.8); backdrop-filter: blur(10px);
            z-index: 1000; border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .logo { font-size: 2rem; font-weight: 700; letter-spacing: -1px; }
        .dot { color: var(--accent); }
        .nav-links a { margin-left: 2rem; font-size: 0.9rem; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }
        .nav-links a:hover { color: var(--accent); }
        .nav-btn {
            background-color: transparent; color: var(--accent) !important;
            border: 1px solid var(--accent);
            padding: 0.5rem 1.2rem; border-radius: 4px; font-weight: 700 !important;
        }

        /* --- PAGE HEADER --- */
        .page-header {
            padding: 12rem 5% 4rem 5%;
            text-align: center;
        }
        .page-header h1 { font-size: clamp(2.5rem, 5vw, 4rem); line-height: 1.1; margin-bottom: 1rem; }
        .page-header p { font-size: 1.2rem; color: var(--text-muted); max-width: 600px; margin: 0 auto; }

        /* --- FORM STYLING --- */
        .form-section { padding: 2rem 5% 6rem 5%; max-width: 800px; margin: 0 auto; }
        
        .application-form {
            background: var(--surface-color);
            padding: 3rem;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .form-group { margin-bottom: 1.5rem; }
        
        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            font-size: 0.95rem;
            color: var(--text-main);
        }

        input, select, textarea {
            width: 100%;
            padding: 1rem;
            background: var(--bg-color);
            border: 1px solid rgba(255,255,255,0.1);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            border-radius: 4px;
            transition: border-color 0.3s ease;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--accent);
        }

        /* Fix dropdown arrow color in dark mode */
        select { appearance: none; background-image: url('data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%239ca3af%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E'); background-repeat: no-repeat; background-position: right 1rem top 50%; background-size: 0.65rem auto; }

        .btn {
            width: 100%; padding: 1.2rem; background-color: var(--accent); color: var(--bg-color);
            font-family: 'Space Grotesk', sans-serif; font-size: 1.1rem; font-weight: 700;
            cursor: pointer; transition: all 0.3s ease; border-radius: 4px; border: none;
            margin-top: 1rem;
        }
        .btn:hover { box-shadow: 0 0 20px var(--accent-glow); }

        footer { text-align: center; padding: 3rem 5%; color: var(--text-muted); border-top: 1px solid rgba(255,255,255,0.05); }

        .reveal { opacity: 0; transform: translateY(30px); transition: all 0.8s ease-out; }
        .reveal.active { opacity: 1; transform: translateY(0); }

        @media (max-width: 768px) { .nav-links { display: none; } .application-form { padding: 2rem; } }
    </style>
</head>
<body>

    <!-- NAVIGATION -->
    <nav>
        <a href="index.html" class="logo">Co<span class="dot">.</span></a>
        <div class="nav-links">
            <a href="model.html">How It Works</a>
            <a href="work.html">Work</a>
            <a href="about.html">About</a>
            <a href="apply.html" class="nav-btn">Apply Now</a>
        </div>
    </nav>

    <!-- HEADER -->
    <header class="page-header">
        <h1 class="reveal">Apply for a Partnership<span class="dot">.</span></h1>
        <p class="reveal">Tell us about your business. We accept a limited number of ad-supported projects each month based on growth potential and fit.</p>
    </header>

    <!-- FORM SECTION -->
    <section class="form-section reveal">
        <!-- THE FORMSPREE ENDPOINT IS INJECTED HERE -->
        <form class="application-form" action="https://formspree.io/f/mrejwply" method="POST">
            
            <!-- MAGIC REDIRECT -->
            <!-- IMPORTANT NOTE: Once your GitHub Pages site is live, change the value below to your exact live URL (e.g., value="https://yourusername.github.io/your-repo/success.html") -->
            <input type="hidden" name="_next" value="success.html">
            
            <!-- Anti-Spam Honeypot -->
            <input type="text" name="_gotcha" style="display:none" />

            <div class="form-group">
                <label for="name">Your Name</label>
                <input type="text" id="name" name="name" required placeholder="John Doe">
            </div>

            <div class="form-group">
                <label for="email">Work Email</label>
                <input type="email" id="email" name="email" required placeholder="john@company.com">
            </div>

            <div class="form-group">
                <label for="business">Business Name & Current Website (if any)</label>
                <input type="text" id="business" name="business" required placeholder="e.g. Acme Corp - acme.com">
            </div>

            <div class="form-group">
                <label for="traffic">Estimated Monthly Website Traffic</label>
                <select id="traffic" name="traffic" required>
                    <option value="" disabled selected>Select an option...</option>
                    <option value="New Business (No Traffic)">New Business (No Traffic yet)</option>
                    <option value="1k - 10k Visitors">1,000 - 10,000 Visitors / month</option>
                    <option value="10k - 50k Visitors">10,000 - 50,000 Visitors / month</option>
                    <option value="50k+ Visitors">50,000+ Visitors / month</option>
                </select>
            </div>

            <div class="form-group">
                <label for="project">Why are you a good fit for the CODOT Ad-Model?</label>
                <textarea id="project" name="project" rows="5" required placeholder="Tell us about your business goals and what you need this website to achieve..."></textarea>
            </div>

            <button type="submit" class="btn">Submit Application</button>
        </form>
    </section>

    <!-- FOOTER -->
    <footer><p>&copy; 2026 CODOT Agency. Built differently.</p></footer>

    <script>
        function reveal() {
            var reveals = document.querySelectorAll(".reveal");
            for (var i = 0; i < reveals.length; i++) {
                var windowHeight = window.innerHeight;
                var elementTop = reveals[i].getBoundingClientRect().top;
                var elementVisible = 100;
                if (elementTop < windowHeight - elementVisible) {
                    reveals[i].classList.add("active");
                }
            }
        }
        window.addEventListener("scroll", reveal); reveal();
    </script>
</body>
</html>
