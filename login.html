<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Client Portal | CODOT</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <style>
        /* --- CORE CSS --- */
        :root {
            --bg-color: #050505;
            --surface-color: #121212;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --accent: #00e5ff;
            --accent-glow: rgba(0, 229, 255, 0.4);
            --error: #ff4757;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        h1, h2, h3, .logo { font-family: 'Space Grotesk', sans-serif; }
        a { text-decoration: none; color: var(--text-main); transition: color 0.3s ease; }

        /* --- NAVIGATION --- */
        nav {
            display: flex; justify-content: space-between; align-items: center;
            padding: 2rem 5%; position: fixed; width: 100%; top: 0;
            background: rgba(5, 5, 5, 0.8); backdrop-filter: blur(10px);
            z-index: 1000; border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .logo { font-size: 2rem; font-weight: 700; letter-spacing: -1px; }
        .dot { color: var(--accent); }
        
        .nav-links a { margin-left: 2rem; font-size: 0.9rem; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }
        .nav-links a:hover, .nav-links a.active { color: var(--accent); }
        .nav-btn {
            background-color: var(--accent); color: var(--bg-color) !important;
            padding: 0.5rem 1.2rem; border-radius: 4px; font-weight: 700 !important;
        }
        .nav-btn:hover { box-shadow: 0 0 15px var(--accent-glow); }

        /* --- AUTH SECTION --- */
        .auth-wrapper {
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 8rem 5% 4rem 5%;
            background: radial-gradient(circle at center, #1a1a1a 0%, var(--bg-color) 100%);
        }

        .auth-card {
            background: var(--surface-color);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 12px;
            padding: 3rem;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            text-align: center;
            animation: fadeIn 0.6s ease-out;
        }

        .auth-card h2 {
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }

        .auth-card p {
            color: var(--text-muted);
            margin-bottom: 2rem;
            font-size: 0.95rem;
        }

        /* --- FORM CONTROLS --- */
        .form-group { margin-bottom: 1.5rem; text-align: left; }
        .form-group label {
            display: block; margin-bottom: 0.5rem; font-weight: 600;
            color: var(--text-muted); font-size: 0.85rem; letter-spacing: 0.5px; text-transform: uppercase;
        }
        
        .form-control {
            width: 100%; padding: 1rem;
            background-color: var(--bg-color); color: var(--text-main);
            border: 1px solid rgba(255,255,255,0.1); border-radius: 6px;
            font-family: 'Inter', sans-serif; font-size: 1rem;
            transition: all 0.3s ease;
        }
        
        .form-control:focus {
            outline: none; border-color: var(--accent);
            box-shadow: 0 0 10px rgba(0, 229, 255, 0.1);
        }

        .btn-submit {
            width: 100%; padding: 1.2rem;
            background-color: var(--accent); color: var(--bg-color);
            border: none; border-radius: 6px;
            font-family: 'Space Grotesk', sans-serif; font-size: 1.1rem; font-weight: 700;
            cursor: pointer; transition: all 0.3s ease; margin-top: 0.5rem;
        }
        .btn-submit:hover { box-shadow: 0 0 20px var(--accent-glow); transform: translateY(-2px); }
        .btn-submit:disabled { opacity: 0.7; cursor: not-allowed; transform: none; box-shadow: none; }

        /* --- OAUTH BUTTONS --- */
        .divider {
            display: flex; align-items: center; text-align: center; margin: 2rem 0; color: var(--text-muted); font-size: 0.85rem;
        }
        .divider::before, .divider::after {
            content: ''; flex: 1; border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .divider:not(:empty)::before { margin-right: 1rem; }
        .divider:not(:empty)::after { margin-left: 1rem; }

        .oauth-btn {
            width: 100%; padding: 1rem; margin-bottom: 1rem;
            background-color: transparent; color: var(--text-main);
            border: 1px solid rgba(255,255,255,0.2); border-radius: 6px;
            font-family: 'Inter', sans-serif; font-size: 1rem; font-weight: 600;
            cursor: pointer; transition: all 0.3s ease;
            display: flex; align-items: center; justify-content: center; gap: 0.8rem;
        }
        
        .oauth-btn:hover { background-color: rgba(255,255,255,0.05); border-color: rgba(255,255,255,0.4); }
        .oauth-btn svg { width: 20px; height: 20px; }

        /* --- ERROR MESSAGE --- */
        #errorMsg {
            color: var(--error); font-size: 0.9rem; margin-top: 1rem; display: none; background: rgba(255, 71, 87, 0.1); padding: 0.8rem; border-radius: 4px; border: 1px solid rgba(255, 71, 87, 0.2);
        }

        /* --- FOOTER --- */
        footer { text-align: center; padding: 2rem 5%; color: var(--text-muted); border-top: 1px solid rgba(255,255,255,0.05); }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        @media (max-width: 768px) {
            .nav-links { display: none; }
            .auth-card { padding: 2rem; }
        }
    </style>
</head>
<body>

    <nav>
        <a href="index.html" class="logo">Co<span class="dot">.</span></a>
        <div class="nav-links">
            <a href="model.html">How It Works</a>
            <a href="work.html">Work</a>
            <a href="about.html">About</a>
            <a href="estimate.html">Instant Quote</a>
            <a href="buyout.html">The Buyout</a>
            <a href="login.html">Client Login</a>
            <a href="apply.html" class="nav-btn">Apply Now</a>
        </div>
    </nav>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            // Get the current file name from the URL
            let currentPath = window.location.pathname.split("/").pop();
            // Default to index.html if on the root path
            if (currentPath === "" || currentPath === "/") currentPath = "index.html";

            // Find all the links in the navigation
            const navLinks = document.querySelectorAll(".nav-links a");
            
            navLinks.forEach(link => {
                // If the link matches the current page, highlight it!
                if (link.getAttribute("href") === currentPath) {
                    link.style.color = "var(--accent)"; // Make text cyan
                    
                    // Add a bottom border to everything except the Apply button
                    if (!link.classList.contains("nav-btn")) {
                        link.style.borderBottom = "2px solid var(--accent)";
                        link.style.paddingBottom = "5px";
                    }
                }
            });
        });
    </script>

    <div class="auth-wrapper">
        <div class="auth-card">
            <h2>Welcome Back<span class="dot">.</span></h2>
            <p>Sign in to access your client dashboard.</p>

            <form id="loginForm">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" class="form-control" placeholder="client@agency.com" required>
                </div>
                
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" class="form-control" placeholder="••••••••" required>
                </div>

                <button type="submit" class="btn-submit" id="loginBtn">Sign In</button>
            </form>

            <div id="errorMsg">Invalid email or password. Please try again.</div>

            <div class="divider">OR CONTINUE WITH</div>

            <button class="oauth-btn" id="googleBtn">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                    <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                    <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                    <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
                </svg>
                Sign in with Google
            </button>

            <button class="oauth-btn" id="githubBtn">
                <svg viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/>
                </svg>
                Sign in with GitHub
            </button>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 CODOT Agency. Built differently.</p>
    </footer>

    <script type="module">
        // Import Firebase modules
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { 
            getAuth, 
            signInWithEmailAndPassword, 
            GoogleAuthProvider, 
            GithubAuthProvider, 
            signInWithPopup 
        } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

        // Your specific Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyD0PjmGveJ_QS4s3S0wFwiDjxdeE4tRKzw",
            authDomain: "codot-agency.firebaseapp.com",
            projectId: "codot-agency",
            storageBucket: "codot-agency.firebasestorage.app",
            messagingSenderId: "22678307444",
            appId: "1:22678307444:web:59c72496bad5db86b3c721"
        };

        // Initialize Firebase & Auth
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // DOM Elements
        const loginForm = document.getElementById('loginForm');
        const loginBtn = document.getElementById('loginBtn');
        const googleBtn = document.getElementById('googleBtn');
        const githubBtn = document.getElementById('githubBtn');
        const errorMsg = document.getElementById('errorMsg');

        // Helper function to handle redirects
        const handleSuccess = (user) => {
            console.log("Logged in successfully:", user);
            window.location.href = "index.html"; // Redirecting back to home page upon success
        };

        // Helper function to display errors
        const handleError = (error) => {
            console.error("Auth Error:", error);
            errorMsg.style.display = 'block';
            // Customizing error text based on Firebase code
            if (error.code === 'auth/invalid-credential') {
                errorMsg.innerText = "Invalid credentials. Please check your email and password.";
            } else if (error.code === 'auth/account-exists-with-different-credential') {
                errorMsg.innerText = "An account already exists with the same email address but different sign-in credentials.";
            } else {
                errorMsg.innerText = "Authentication failed. Please try again.";
            }
        };

        // 1. Email/Password Sign In
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorMsg.style.display = 'none';
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            loginBtn.disabled = true;
            loginBtn.innerText = "Signing In...";

            try {
                const userCredential = await signInWithEmailAndPassword(auth, email, password);
                handleSuccess(userCredential.user);
            } catch (error) {
                handleError(error);
                loginBtn.disabled = false;
                loginBtn.innerText = "Sign In";
            }
        });

        // 2. Google Sign In
        googleBtn.addEventListener('click', async () => {
            errorMsg.style.display = 'none';
            const provider = new GoogleAuthProvider();
            try {
                const result = await signInWithPopup(auth, provider);
                handleSuccess(result.user);
            } catch (error) {
                handleError(error);
            }
        });

        // 3. GitHub Sign In
        githubBtn.addEventListener('click', async () => {
            errorMsg.style.display = 'none';
            const provider = new GithubAuthProvider();
            try {
                const result = await signInWithPopup(auth, provider);
                handleSuccess(result.user);
            } catch (error) {
                handleError(error);
            }
        });
    </script>
</body>
</html>
